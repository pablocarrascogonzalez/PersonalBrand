<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Tech Accent Gradients: Electric Cyan to Neon Emerald -->
    <linearGradient id="cyanToEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="emeraldToCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Subtle Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle / App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#badgeGlow)"/>

  <!-- Subtle Radial Glow in Center -->
  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.06"/>
  <circle cx="280" cy="230" r="120" fill="#38bdf8" opacity="0.05"/>

  <!-- P & C Monogram Group -->
  <g>
    <!-- 'P' Vertical Spine (Architecture & Foundation) -->
    <rect x="136" y="128" width="44" height="256" rx="22" fill="url(#cyanToEmerald)"/>

    <!-- Terminal Prompt symbol '> ' inside the P vertical stem -->
    <path d="M 152 244 L 164 256 L 152 268" fill="none" stroke="#0b1120" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 'P' Upper Loop (Forward Vision) -->
    <path d="M 170 128 H 262 C 318 128, 356 166, 356 216 C 356 266, 318 304, 262 304 H 170" 
          fill="none" 
          stroke="url(#cyanToEmerald)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- 'C' Interlocking Outer Curve (Data Platform & Integration) -->
    <path d="M 334 184 C 298 144, 224 158, 224 256 C 224 340, 286 376, 352 352" 
          fill="none" 
          stroke="url(#emeraldToCyan)" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Data Platform Terminal Node: Glowing Core Accent -->
    <circle cx="352" cy="352" r="16" fill="#38bdf8"/>
    <circle cx="352" cy="352" r="7" fill="#ffffff"/>
  </g>
</svg>
